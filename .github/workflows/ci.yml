name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ (github.repository != 'MooseGooseConsulting/GitAtlas' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) || vars.CI_FORCE_HOSTED == 'true') && 'ubuntu-latest' || 'moosegoose-linux' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1.2.2
      - name: Install dependencies
        run: bun install
      - name: Lint
        run: bun run lint
      - name: Test
        # Generate needs a PostgreSQL-format URL (schema provider is
        # postgresql); the tracked .env SQLite URL would P1012 on runners
        # without DATABASE_URL configured. Generate is build-time only —
        # no DB connection is opened.
        run: DATABASE_URL=${DATABASE_URL:-postgresql://ci:ci@localhost:5432/gitatlas_ci} bunx prisma generate && bunx vitest run

name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ (github.repository != 'MooseGooseConsulting/GitAtlas' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) || vars.CI_FORCE_HOSTED == 'true') && 'ubuntu-latest' || 'moosegoose-linux' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1.2.2
      - name: Install dependencies
        run: bun install
      - name: Lint
        run: bun run lint
      - name: Test
        run: bun test
